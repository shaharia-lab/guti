# Site settings
title: Guti Documentation
description: Documentation for the Guti Golang utility library
baseurl: ""
url: ""

# Build settings
markdown: kramdown
remote_theme: pages-themes/slate@v0.2.0
plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag

# Serving settings
port: 4000
host: 0.0.0.0

# Exclude patterns
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - .sass-cache/
  - .jekyll-cache/
  - .git/